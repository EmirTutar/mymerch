spring:
  application:
    name: mymerch

app:
  cors:
    # Kommagetrennt, ohne Leerzeichen. In Render als Env-Var CORS_ALLOWED_ORIGINS
    # auf die echte Vercel-Domain setzen, z.B. https://mymerch.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Database configuration
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    #driver-class-name: org.postgresql.Driver

#ORM configuration
#Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        #dialect: org.hibernate.dialect.PostgreSQLDialect